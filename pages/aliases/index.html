<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>分类昵称管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-icon">🌸</div>
        <div>
          <h1 id="heading">分类昵称管理</h1>
          <p class="subtitle" id="subtitle">给分类取个可爱的名字吧～ 发送「看看昵称」=「看看分类」</p>
        </div>
      </div>

      <div class="card add-card">
        <div class="card-title">✨ 添加新昵称</div>
        <div class="add-row">
          <div class="field-group">
            <label>昵称</label>
            <input type="text" id="alias-input" placeholder="比如：爱莉" />
          </div>
          <span class="eq">=</span>
          <div class="field-group">
            <label>分类</label>
            <div class="cat-row">
              <select id="category-select">
                <option value="">选择已有分类...</option>
              </select>
              <span class="or-text">或</span>
              <input type="text" id="category-input" placeholder="手动输入" />
            </div>
          </div>
          <button id="add-btn" class="btn btn-add">
            <span class="btn-icon">+</span> 添加
          </button>
        </div>
      </div>

      <div id="msg" class="msg" style="display:none"></div>

      <div class="card table-card">
        <div class="card-title">📋 当前昵称列表</div>
        <div id="table-wrap">
          <table id="alias-table">
            <thead>
              <tr>
                <th>昵称</th>
                <th></th>
                <th>真实分类名</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="alias-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="actions">
        <button id="save-btn" class="btn btn-save" disabled>
          <span class="btn-icon">💾</span> 保存更改
        </button>
        <button id="reload-btn" class="btn btn-reload">
          <span class="btn-icon">🔄</span> 重新加载
        </button>
      </div>

      <div class="footer">Made with 💕 by Airi Gallery Plugin</div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
