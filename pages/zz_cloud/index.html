<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Airi Gallery Cloud</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icon">🌸</div>
    <h1>Airi Gallery Cloud</h1>
    <div class="header-actions">
      <button class="icon-btn theme-btn" id="theme-btn" title="切换主题">🌙</button>
      <button class="icon-btn" id="sync-btn" title="同步远程仓库">🔄</button>
      <button class="icon-btn" id="settings-btn" title="设置">⚙️</button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar disconnected" id="status-bar">
    <span class="dot"></span>
    <span id="status-text">未连接</span>
    <span class="stats" id="status-stats"></span>
  </div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settings-panel">
    <div class="card-title">⚙️ GitHub / Gitee 配置</div>
    <div class="settings-grid">
      <div class="field full">
        <label class="field-label">默认图库</label>
        <select id="cfg-default-gallery">
          <option value="custom">自定义仓库</option>
          <option value="builtin" data-platform="github" data-owner="Lidure" data-repo="airi-gallery-images" data-branch="main">Airi 默认公共图库</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">平台</label>
        <select id="cfg-platform">
          <option value="github">GitHub</option>
          <option value="gitee">Gitee</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">分支</label>
        <input type="text" id="cfg-branch" placeholder="main" value="main" />
      </div>
      <div class="field">
        <label class="field-label">仓库所有者</label>
        <input type="text" id="cfg-owner" placeholder="Lidure" value="Lidure" />
      </div>
      <div class="field">
        <label class="field-label">仓库名称</label>
        <input type="text" id="cfg-repo" placeholder="airi-gallery-images" value="airi-gallery-images" />
      </div>
      <div class="field full">
        <label class="field-label">Access Token</label>
        <input type="password" id="cfg-token" placeholder="ghp_xxxx 或 Gitee 私人令牌" />
        <div class="hint">公开 GitHub 图库可不填 Token 只读浏览；上传或删除需要 Token。</div>
      </div>
    </div>
    <div class="settings-actions">
      <button class="btn btn-pink" id="save-cfg-btn">💾 保存并连接</button>
      <button class="btn btn-ghost" id="test-cfg-btn">🔍 测试连接</button>
    </div>
  </div>

  <!-- Upload section -->
  <div class="card is-hidden" id="upload-card">
    <div class="card-title">📤 上传图片</div>
    <div class="field">
      <label class="field-label">分类</label>
      <div class="row">
        <select id="up-sel" class="flex-field"><option value="">选择已有分类...</option></select>
        <input type="text" id="up-input" class="flex-field" placeholder="或手动输入新分类" />
      </div>
    </div>
    <div class="field">
      <label class="field-label">图片</label>
      <div class="drop-zone" id="drop">
        <div class="icon">📁</div>
        <p>点击选择或拖拽图片到这里</p>
        <p class="hint">支持多选，可同时上传多张</p>
        <input type="file" id="file" class="is-hidden" multiple accept="image/*" />
      </div>
    </div>
    <div id="preview" class="preview-grid is-hidden"></div>
    <div id="up-actions" class="upload-actions is-hidden">
      <button class="btn btn-pink" id="up-btn">✨ 上传 (<span id="up-count">0</span>) 张</button>
    </div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg"><progress class="progress-bar" id="progress-bar" max="100" value="0"></progress></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
  </div>

  <!-- Browse section -->
  <div class="card is-hidden" id="browse-card">
    <div class="card-title">🗂️ 图库分类</div>
    <div class="tabs" id="tabs"></div>
    <div class="grid-toolbar">
      <label>每页</label>
      <input type="number" id="per-page-input" value="21" min="1" max="100" class="input-sm" />
      <label>张</label>
    </div>
    <div id="grid" class="grid"></div>
    <div class="pager is-hidden" id="pager">
      <button class="pager-btn" id="first-btn" title="首页">⟨⟨</button>
      <button class="pager-btn" id="prev-btn" title="上一页">⟨</button>
      <span class="page-indicator" id="page-indicator"></span>
      <button class="pager-btn" id="next-btn" title="下一页">⟩</button>
      <button class="pager-btn" id="last-btn" title="末页">⟩⟩</button>
    </div>
  </div>

  <!-- Welcome (when not configured) -->
  <div class="card" id="welcome-card">
    <div class="empty">
      <div class="icon">🌸</div>
      <p class="welcome-title">欢迎使用 Airi Gallery Cloud</p>
      <p class="welcome-copy">点击右上角 ⚙️ 配置你的 GitHub/Gitee 仓库信息，<br>即可随时随地通过网页管理图库。</p>
    </div>
  </div>
</div>

<!-- Image modal -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <button class="close-btn" id="close">×</button>
    <img id="mimg" />
  </div>
</div>

<!-- Confirm dialog -->
<div class="confirm-mask" id="confirm-mask">
  <div class="confirm-box">
    <p id="confirm-text"></p>
    <img id="confirm-img" class="confirm-image is-hidden" alt="查重提示图" />
    <div class="btns">
      <button class="btn btn-sm" id="confirm-no">取消</button>
      <button class="btn btn-sm btn-pink" id="confirm-yes">确认</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
