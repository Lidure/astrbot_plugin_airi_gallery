<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airi Gallery</title>
  <link rel="stylesheet" href="./style.css?v=9" />
</head>
<body>
  <div class="container">
    <header class="header">
      <img class="header-logo" src="./logo.png" alt="" aria-hidden="true" />
      <div class="header-copy">
        <h1>Airi Gallery</h1>
        <p>本地图库管理</p>
      </div>
    </header>

    <div class="view-switcher" role="tablist" aria-label="管理页面">
      <button id="view-gallery-tab" class="view-tab active" type="button" role="tab"
              aria-selected="true" aria-controls="view-gallery">图库管理</button>
      <button id="view-aliases-tab" class="view-tab" type="button" role="tab"
              aria-selected="false" aria-controls="view-aliases">分类昵称</button>
    </div>

    <main id="view-gallery" class="view-panel" role="tabpanel" aria-labelledby="view-gallery-tab">
      <section class="card" aria-labelledby="upload-title">
        <div class="section-heading">
          <div>
            <h2 id="upload-title">上传图片</h2>
            <p>选择已有分类或输入新分类</p>
          </div>
        </div>

        <div class="field">
          <label for="up-sel">分类</label>
          <div class="field-row">
            <select id="up-sel"><option value="">选择已有分类...</option></select>
            <input type="text" id="up-input" placeholder="或输入新分类" autocomplete="off" />
          </div>
        </div>

        <div class="field">
          <span class="field-label">图片</span>
          <div class="drop-zone" id="drop" role="button" tabindex="0">
            <strong>选择图片</strong>
            <span>点击或拖放，可一次上传多张</span>
            <input type="file" id="file" multiple accept="image/*" hidden />
          </div>
        </div>

        <div id="preview" class="preview-grid" hidden></div>
        <div id="up-actions" class="upload-actions" hidden>
          <button class="btn btn-primary" id="up-btn" type="button">上传 <span id="up-count">0</span> 张</button>
        </div>
      </section>

      <section class="card" aria-labelledby="gallery-title">
        <div class="section-heading gallery-heading">
          <div>
            <h2 id="gallery-title">图库分类</h2>
            <p>选择分类查看和管理图片</p>
          </div>
          <div class="page-size">
            <label for="per-page-input">每页</label>
            <input type="number" id="per-page-input" value="21" min="1" max="200" />
            <span>张</span>
          </div>
        </div>
        <div class="category-tabs" id="tabs"></div>
        <div id="grid" class="image-grid"></div>
        <nav class="pager" id="pager" aria-label="图库分页" hidden>
          <button class="btn btn-quiet btn-small" id="first-btn" type="button" hidden>首页</button>
          <button class="btn btn-quiet btn-small" id="prev-btn" type="button" hidden>上一页</button>
          <select id="page-sel" aria-label="选择页码"></select>
          <button class="btn btn-quiet btn-small" id="next-btn" type="button" hidden>下一页</button>
          <button class="btn btn-quiet btn-small" id="last-btn" type="button" hidden>末页</button>
        </nav>
      </section>
    </main>

    <main id="view-aliases" class="view-panel" role="tabpanel" aria-labelledby="view-aliases-tab" hidden>
      <section class="card" aria-labelledby="alias-add-title">
        <div class="section-heading">
          <div>
            <h2 id="alias-add-title">添加分类昵称</h2>
            <p>例如“爱莉”可以指向真实分类“airi”</p>
          </div>
        </div>
        <div class="alias-form">
          <div class="field compact-field">
            <label for="alias-input">昵称</label>
            <input type="text" id="alias-input" placeholder="例如：爱莉" autocomplete="off" />
          </div>
          <span class="alias-equals" aria-hidden="true">=</span>
          <div class="field compact-field alias-category-field">
            <label for="alias-category-select">真实分类</label>
            <div class="field-row">
              <select id="alias-category-select"><option value="">选择已有分类...</option></select>
              <input type="text" id="alias-category-input" placeholder="或手动输入" autocomplete="off" />
            </div>
          </div>
          <button id="alias-add-btn" class="btn btn-primary" type="button" disabled>添加</button>
        </div>
      </section>

      <section class="card" aria-labelledby="alias-list-title">
        <div class="section-heading alias-list-heading">
          <div>
            <h2 id="alias-list-title">当前昵称</h2>
            <p id="alias-summary">尚未加载</p>
          </div>
        </div>
        <div class="alias-table-wrap">
          <table class="alias-table">
            <thead>
              <tr>
                <th scope="col">昵称</th>
                <th scope="col" class="equals-column"></th>
                <th scope="col">真实分类</th>
                <th scope="col" class="action-column">操作</th>
              </tr>
            </thead>
            <tbody id="alias-tbody"></tbody>
          </table>
        </div>
        <div class="alias-actions">
          <span id="alias-dirty-state" class="dirty-state" aria-live="polite"></span>
          <div class="action-buttons">
            <button id="alias-reload-btn" class="btn btn-quiet" type="button">重新加载</button>
            <button id="alias-save-btn" class="btn btn-save" type="button" disabled>保存更改</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="compare-mask" id="compare-mask" role="dialog" aria-modal="true" aria-labelledby="compare-title">
    <section class="compare-dialog">
      <div class="compare-heading">
        <div>
          <h2 id="compare-title">上传图片对比</h2>
          <p>左侧为图库候选，右侧为待上传图片；点击图片可放大。</p>
        </div>
      </div>
      <div id="compare-list" class="compare-list"></div>
      <div class="compare-actions">
        <button class="btn btn-quiet" id="compare-no" type="button">跳过</button>
        <button class="btn btn-primary" id="compare-yes" type="button">仍然上传</button>
      </div>
    </section>
  </div>

  <div class="modal-mask" id="mask" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="modal">
      <button class="close-btn" id="close" type="button" aria-label="关闭预览">×</button>
      <img id="mimg" alt="图库图片预览" />
    </div>
  </div>

  <script type="module" src="./app.js?v=9"></script>
</body>
</html>
