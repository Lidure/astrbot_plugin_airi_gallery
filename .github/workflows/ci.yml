name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python -m pytest tests -v

  dependency-floor:
    name: dependency-floor (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install Pillow==10.0.0 requests==2.28.0 pytest pyyaml quart
      - run: python -m pytest tests -v

  astrbot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install AstrBot
      - run: python -m pip install -r requirements.txt
      - run: python tests/astrbot_runtime_smoke.py

  apply-category-cover-grid:
    if: github.ref == 'refs/heads/ui/category-cover-grid' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/category-cover-grid
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply implementation
        run: python scripts/_tmp_apply_category_cover_grid.py
      - name: Verify focused contracts
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_category_cover_grid.py tests/test_generated_poster_layout.py -q
      - name: Restore CI and remove temporary patch tools
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/_tmp_apply_category_cover_grid.yml
          rm -f scripts/_tmp_apply_category_cover_grid.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show category cover grid'
          git push origin HEAD:ui/category-cover-grid
