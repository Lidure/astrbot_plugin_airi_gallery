name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-webui-lazy-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/perf/webui-lazy-image-loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/webui-lazy-image-loading
          fetch-depth: 0
      - name: Apply scoped backend and WebUI edits
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("main.py")
          main_text = main_path.read_text(encoding="utf-8")
          start = main_text.index("    async def _api_category_images(self):\n")
          end = main_text.index("    def _cache_api_similar_upload(\n", start)
          replacement = '''    async def _api_category_images(self):
              from quart import request, jsonify
              if not _is_authenticated_web_request():
                  return jsonify({"ok": False, "error": "unauthorized"}), 403
              category = request.args.get("category", "").strip()
              page = max(1, int(request.args.get("page", 1)))
              per_page = max(1, min(50, int(request.args.get("per_page", 20))))
              if not category:
                  return jsonify({"error": "缺少 category 参数"}), 400
              category_dir = resolve_gallery_category_dir(self.gallery_root, category)
              if category_dir is None:
                  return jsonify({"error": "invalid category"}), 400
              if not category_dir.exists():
                  return jsonify({"images": [], "total": 0, "page": page, "per_page": per_page})
              all_files = []
              for path in category_dir.iterdir():
                  safe_path = resolve_gallery_image_path(
                      self.gallery_root, category, path.name
                  )
                  if safe_path is not None and _is_image_file(safe_path):
                      all_files.append(safe_path)
              all_files.sort(key=lambda x: _image_sort_key(x, category_dir))
              total = len(all_files)
              start = (page - 1) * per_page
              page_files = all_files[start:start + per_page]
              result = [{"name": path.name} for path in page_files]
              return jsonify({"images": result, "total": total, "page": page, "per_page": per_page, "category": category})

'''
          main_text = main_text[:start] + replacement + main_text[end:]
          main_path.write_text(main_text, encoding="utf-8")

          js_path = Path("pages/gallery/app.js")
          js = js_path.read_text(encoding="utf-8")
          state_anchor = "const imgCache = {};\n"
          if js.count(state_anchor) != 1:
              raise SystemExit(f"unexpected imgCache anchor count: {js.count(state_anchor)}")
          js = js.replace(
              state_anchor,
              state_anchor
              + "let gridImageObserver = null;\n"
              + "let modalObjectUrl = \"\";\n"
              + "const uploadPreviewObjectUrls = new Set();\n",
              1,
          )

          helper_anchor = "async function loadCats() {\n"
          helpers = r'''function releasePreviewObjectUrls(urls) {
            for (const url of urls) {
              try { URL.revokeObjectURL(url); } catch (error) { /* ignore stale URLs */ }
            }
            urls.clear();
          }

          function releaseModalObjectUrl() {
            if (!modalObjectUrl) return;
            try { URL.revokeObjectURL(modalObjectUrl); } catch (error) { /* ignore stale URLs */ }
            modalObjectUrl = "";
          }

          function setModalImagePayload(data, alt) {
            const url = makeBlobUrl(data?.data, data?.content_type);
            if (!url) return false;
            releaseModalObjectUrl();
            modalObjectUrl = url;
            modalImage.src = url;
            modalImage.alt = alt;
            mask.classList.add("show");
            closeBtn.focus();
            return true;
          }

          function revokeGridImageUrl(image) {
            const url = image?.dataset?.objectUrl || "";
            if (!url) return;
            try { URL.revokeObjectURL(url); } catch (error) { /* ignore stale URLs */ }
            delete image.dataset.objectUrl;
          }

          function releaseGridImageResources() {
            if (gridImageObserver) {
              gridImageObserver.disconnect();
              gridImageObserver = null;
            }
            for (const image of grid.querySelectorAll("img[data-object-url]")) {
              revokeGridImageUrl(image);
              image.removeAttribute("src");
            }
          }

          async function loadGridImage(image) {
            if (!image?.isConnected) return;
            if (image.dataset.loadState === "loading" || image.dataset.loadState === "loaded") return;
            const category = image.dataset.category || "";
            const name = image.dataset.name || "";
            if (!category || !name) return;
            image.dataset.loadState = "loading";
            try {
              const data = await apiGet("category_image", { category, name });
              const url = makeBlobUrl(data?.data, data?.content_type);
              if (!url) throw new Error("图片数据为空");
              if (!image.isConnected || image.dataset.category !== category || image.dataset.name !== name) {
                URL.revokeObjectURL(url);
                return;
              }
              revokeGridImageUrl(image);
              image.dataset.objectUrl = url;
              image.src = url;
              image.dataset.loadState = "loaded";
            } catch (error) {
              if (image.isConnected) image.dataset.loadState = "failed";
              console.warn("[gallery] failed to lazy-load image", category, name, error);
            }
          }

          function observeGridImage(image) {
            if (typeof window.IntersectionObserver !== "function") {
              void loadGridImage(image);
              return;
            }
            if (!gridImageObserver) {
              gridImageObserver = new IntersectionObserver(entries => {
                for (const entry of entries) {
                  if (!entry.isIntersecting) continue;
                  gridImageObserver?.unobserve(entry.target);
                  void loadGridImage(entry.target);
                }
              }, { rootMargin: "400px 0px" });
            }
            gridImageObserver.observe(image);
          }

          async function openImagePreview(category, name) {
            try {
              const data = await apiGet("category_image", { category, name });
              if (!setModalImagePayload(data, name)) throw new Error("图片数据为空");
            } catch (error) {
              console.warn("[gallery] failed to load image preview", category, name, error);
              showMsg("图片预览加载失败", false);
            }
          }

          '''
          if js.count(helper_anchor) != 1:
              raise SystemExit(f"unexpected loadCats anchor count: {js.count(helper_anchor)}")
          js = js.replace(helper_anchor, helpers + helper_anchor, 1)

          load_start = js.index("async function loadImgs() {\n")
          load_end = js.index("function renderGrid(data) {\n", load_start)
          new_load = r'''async function loadImgs() {
            if (!currentCat) {
              releaseGridImageResources();
              grid.innerHTML = '<div class="empty">选择一个分类查看图片</div>';
              pager.hidden = true;
              return;
            }
            const cacheKey = `${currentCat}_${currentPage}_${perPage}`;
            if (imgCache[cacheKey]) {
              renderGrid(imgCache[cacheKey]);
              renderPagination();
              return;
            }
            releaseGridImageResources();
            grid.innerHTML = '<div class="empty">加载中...</div>';
            try {
              const data = await apiGet("category_images", {
                category: currentCat,
                page: currentPage,
                per_page: perPage,
              });
              const images = Array.isArray(data.images) ? data.images : [];
              const total = Number(data.total) || 0;
              totalPages = Math.max(1, Math.ceil(total / perPage));
              if (currentPage > totalPages) currentPage = totalPages;
              imgCache[cacheKey] = { imgs: images, total };
              renderGrid(imgCache[cacheKey]);
              renderPagination();
            } catch (error) {
              releaseGridImageResources();
              grid.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
              pager.hidden = true;
            }
          }

          '''
          js = js[:load_start] + new_load + js[load_end:]

          grid_start = js.index("function renderGrid(data) {\n")
          grid_end = js.index("function renderPagination() {\n", grid_start)
          new_grid = r'''function renderGrid(data) {
            const images = data.imgs;
            releaseGridImageResources();
            grid.replaceChildren();
            if (!images.length) {
              const empty = document.createElement("div");
              empty.className = "empty";
              empty.textContent = "该分类暂无图片";
              grid.appendChild(empty);
              return;
            }

            for (const item of images) {
              const name = String(item.name || "");
              const indexMatch = name.match(/^(\d+)/);
              const imageItem = document.createElement("div");
              imageItem.className = "grid-item";
              imageItem.tabIndex = 0;

              const image = document.createElement("img");
              image.loading = "lazy";
              image.decoding = "async";
              image.alt = name;
              image.dataset.category = currentCat;
              image.dataset.name = name;
              image.dataset.loadState = "idle";

              const badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = `#${indexMatch ? indexMatch[1] : "?"}`;

              const deleteButton = document.createElement("button");
              deleteButton.type = "button";
              deleteButton.className = "del-btn";
              deleteButton.textContent = "×";
              deleteButton.setAttribute("aria-label", `删除 ${name}`);
              deleteButton.addEventListener("click", async event => {
                event.stopPropagation();
                deleteButton.disabled = true;
                try {
                  const result = await apiPost("delete_image", { category: image.dataset.category, name });
                  if (result?.ok === false) throw new Error(result.error || "删除失败");
                  clearImageCache(image.dataset.category);
                  await loadImgs();
                  showMsg(`已删除 ${name}`);
                } catch (error) {
                  deleteButton.disabled = false;
                  showMsg(error.message || "删除失败", false);
                }
              });

              const openPreview = () => {
                void openImagePreview(image.dataset.category, name);
              };
              imageItem.addEventListener("click", openPreview);
              imageItem.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                  event.preventDefault();
                  openPreview();
                }
              });

              imageItem.append(image, badge, deleteButton);
              grid.appendChild(imageItem);
              observeGridImage(image);
            }
          }

          '''
          js = js[:grid_start] + new_grid + js[grid_end:]

          preview_start = js.index("function renderPreview() {\n")
          preview_end = js.index("function fileToBase64(file) {\n", preview_start)
          new_preview = r'''function renderPreview() {
            releasePreviewObjectUrls(uploadPreviewObjectUrls);
            preview.replaceChildren();
            preview.hidden = pendingFiles.length === 0;
            upActions.hidden = pendingFiles.length === 0;
            upCount.textContent = String(pendingFiles.length);
            pendingFiles.forEach((file, index) => {
              const item = document.createElement("div");
              item.className = "preview-item";
              const image = document.createElement("img");
              const objectUrl = URL.createObjectURL(file);
              uploadPreviewObjectUrls.add(objectUrl);
              image.src = objectUrl;
              image.alt = file.name;
              const removeButton = document.createElement("button");
              removeButton.type = "button";
              removeButton.className = "rm";
              removeButton.textContent = "×";
              removeButton.setAttribute("aria-label", `移除 ${file.name}`);
              removeButton.addEventListener("click", () => {
                pendingFiles.splice(index, 1);
                renderPreview();
              });
              item.append(image, removeButton);
              preview.appendChild(item);
            });
          }

          '''
          js = js[:preview_start] + new_preview + js[preview_end:]

          match_start = js.index("async function showMatchPreview(match) {\n")
          match_end = js.index("async function encodeUploadFile(file) {\n", match_start)
          new_match = r'''async function showMatchPreview(match) {
            const location = parseGalleryMatchPath(match?.path);
            if (!location) return;
            await openImagePreview(location.category, location.name);
          }

          '''
          js = js[:match_start] + new_match + js[match_end:]

          unload_start = js.index('window.addEventListener("beforeunload", event => {\n')
          unload_end = js.index('closeBtn.addEventListener("click", closePreview);\n', unload_start)
          new_unload = r'''window.addEventListener("beforeunload", event => {
            releaseGridImageResources();
            releasePreviewObjectUrls(uploadPreviewObjectUrls);
            releaseModalObjectUrl();
            if (!aliasesDirty) return;
            event.preventDefault();
            event.returnValue = "";
          });

          function closePreview() {
            mask.classList.remove("show");
            modalImage.removeAttribute("src");
            releaseModalObjectUrl();
          }

          '''
          js = js[:unload_start] + new_unload + js[unload_end:]
          js_path.write_text(js, encoding="utf-8")
          PY
      - name: Validate patched sources
        run: |
          python -m compileall -q main.py
          node --check pages/gallery/app.js
      - name: Commit scoped implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/apply-webui-lazy-images.yml
          git add .github/workflows/ci.yml main.py pages/gallery/app.js
          git commit -m "perf: lazy-load authenticated WebUI images"
          git push origin HEAD:perf/webui-lazy-image-loading

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python -m pytest tests -v
