name: Apply v2.11.8 Git tree metadata fix

on:
  push:
    branches:
      - fix/preserve-git-tree-metadata-v2118

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/preserve-git-tree-metadata-v2118
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply minimal production fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('    def _git_list_tree_at(')
          end = source.index('\n    def ', start + 8)
          block = source[start:end]
          body_start = block.index('        result = []')
          body_end = block.index('        return result', body_start) + len('        return result')
          replacement = '\n'.join([
              '        result = []',
              '        for entry in data.get("tree", []):',
              '            entry_type = str(entry.get("type", "")).strip()',
              '            if entry_type not in {"blob", "tree"}:',
              '                continue',
              '            result.append({',
              '                "path": entry["path"],',
              '                "sha": entry.get("sha", ""),',
              '                "size": entry.get("size", 0),',
              '                "type": entry.get("type", ""),',
              '                "mode": entry.get("mode", ""),',
              '            })',
              '        return result',
          ])
          block = block[:body_start] + replacement + block[body_end:]
          source = source[:start] + block + source[end:]
          source = source.replace('CURRENT_PLUGIN_VERSION = "v2.11.7"', 'CURRENT_PLUGIN_VERSION = "v2.11.8"', 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify focused regression and syntax
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m py_compile main.py gallery_safety.py
          python -m pytest tests/test_hierarchical_renumber.py -q
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/_apply-v2118-tree-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/_apply-v2118-tree-metadata.yml
          git commit -m 'fix: preserve Git tree metadata for renumber'
          git push origin HEAD:fix/preserve-git-tree-metadata-v2118
