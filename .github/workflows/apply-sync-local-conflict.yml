name: Apply sync local conflict hardening

on:
  push:
    branches:
      - hardening/sync-local-conflicts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact sync safety edits
        shell: python
        run: |
          from pathlib import Path

          safety_path = Path("gallery_safety.py")
          safety = safety_path.read_text(encoding="utf-8")
          marker = "\n\ndef matches_verified_remote_content(\n"
          start = safety.index(marker) + 2
          next_func = safety.index("\n\ndef ", start + len("def matches_verified_remote_content"))
          block = safety[start:next_func]
          if "return current_sha in proven_shas" not in block:
              raise SystemExit("matches_verified_remote_content target not found")
          helper = "\n".join([
              "",
              "",
              "def should_preserve_local_sync_content(",
              "    content: bytes, entry: object, remote_sha: str",
              ") -> bool:",
              '    \"\"\"Return True when pull sync must preserve current local bytes.\"\"\"',
              "    current_sha = git_blob_sha(content)",
              '    normalized_remote_sha = str(remote_sha or \"\").strip()',
              "    if normalized_remote_sha and current_sha == normalized_remote_sha:",
              "        return False",
              "    baseline_sha = verified_remote_sha(entry)",
              "    if baseline_sha:",
              "        return current_sha != baseline_sha",
              "    return True",
          ])
          safety = safety[:next_func] + helper + safety[next_func:]
          safety_path.write_text(safety, encoding="utf-8")

          main_path = Path("main.py")
          main = main_path.read_text(encoding="utf-8")
          import_marker = "        select_remote_delete_candidates,\n        validate_image_payload,"
          if main.count(import_marker) != 2:
              raise SystemExit("expected two gallery_safety import markers")
          main = main.replace(
              import_marker,
              "        select_remote_delete_candidates,\n        should_preserve_local_sync_content,\n        validate_image_payload,",
          )

          report_start = main.index("    @classmethod\n    def _format_sync_report")
          report_end = main.index("\n    def _git_sync_from_remote", report_start)
          new_report = "\n".join([
              "    @classmethod",
              "    def _format_sync_report(cls, result: dict) -> str:",
              '        if result.get("busy"):',
              '            return "已有同步任务正在进行，本次已跳过。"',
              '        if result.get("failed"):',
              '            return str(result.get("error") or "同步失败：远程图库状态无法确认。")',
              "",
              '        synced = int(result.get("synced", 0) or 0)',
              '        removed = int(result.get("removed", 0) or 0)',
              '        local_only = tuple(result.get("remaining_local_only") or ())',
              '        remote_only = tuple(result.get("remaining_remote_only") or ())',
              '        content_conflicts = tuple(result.get("content_conflicts") or ())',
              '        base = f"同步完成：新增 {synced} 张，移除 {removed} 张。"',
              "        if not local_only and not remote_only and not content_conflicts:",
              '            return base + "\\n本地与 GitHub 图片路径和内容已一致。"',
              "",
              "        details: list[str] = []",
              "        if local_only or remote_only:",
              "            diff = GalleryPathDifference(local_only=local_only, remote_only=remote_only)",
              "            details.append(cls._format_gallery_path_difference(diff))",
              "        if content_conflicts:",
              '            preview = "、".join(content_conflicts[:5])',
              '            suffix = f" 等 {len(content_conflicts)} 项" if len(content_conflicts) > 5 else ""',
              '            details.append(f"内容冲突：{preview}{suffix}")',
              "",
              "        return (",
              "            base",
              '            + "\\n同步后仍未完全一致："',
              '            + "；".join(details)',
              '            + "\\n仅本地项目会保留以避免误删；要保留请执行 /推送到远程，不需要则删除本地文件后再次 /立即同步。"',
              '            + " 同路径内容冲突表示本地文件已被修改或无法安全确认；要以远端为准，请先备份并删除对应本地文件，再执行 /立即同步。"',
              '            + " 仅 GitHub 项目表示本次下载未完成，可再次执行 /立即同步。"',
              "        )",
              "",
          ])
          main = main[:report_start] + new_report + main[report_end:]

          sync_start = main.index("    def _git_sync_from_remote")
          sync_end = main.index("\n    def _git_push_file", sync_start)
          sync = main[sync_start:sync_end]
          result_marker = '            "remaining_remote_only": (),\n        }'
          if result_marker not in sync:
              raise SystemExit("sync result marker not found")
          sync = sync.replace(
              result_marker,
              '            "remaining_remote_only": (),\n            "content_conflicts": (),\n        }',
              1,
          )
          loop_marker = "            synced = 0\n            for git_path, info in remote_images.items():"
          if loop_marker not in sync:
              raise SystemExit("sync loop marker not found")
          sync = sync.replace(
              loop_marker,
              "            synced = 0\n            content_conflicts: list[str] = []\n            for git_path, info in remote_images.items():",
              1,
          )

          existing_start = sync.index("                if local_path.exists():")
          content_fetch = sync.index("                content = self._git_get_file(git_path)", existing_start)
          new_existing = "\n".join([
              "                if local_path.exists():",
              "                    try:",
              "                        with self._hash_index_lock:",
              "                            entry = self._hash_index.get(git_path)",
              "                        local_content = local_path.read_bytes()",
              "                    except OSError as exc:",
              "                        content_conflicts.append(git_path)",
              "                        logger.warning(",
              '                            f"[Git Sync] 本地内容无法读取，为避免覆盖予以保留: {git_path}: {exc}"',
              "                        )",
              "                        continue",
              "",
              "                    if git_blob_sha(local_content) == remote_sha:",
              "                        self._sha_cache[git_path] = remote_sha",
              "                        self._remember_verified_remote_content(",
              "                            git_path, local_content, remote_sha, save=False",
              "                        )",
              "                        continue",
              "                    if should_preserve_local_sync_content(",
              "                        local_content, entry, remote_sha",
              "                    ):",
              "                        content_conflicts.append(git_path)",
              "                        logger.warning(",
              '                            f"[Git Sync] 本地内容已修改，为避免覆盖予以保留: {git_path}"',
              "                        )",
              "                        continue",
              "                else:",
              "                    local_path.parent.mkdir(parents=True, exist_ok=True)",
              "",
          ])
          sync = sync[:existing_start] + new_existing + sync[content_fetch:]

          paths_marker = "            local_image_paths = {"
          if paths_marker not in sync:
              raise SystemExit("local path collection marker not found")
          sync = sync.replace(
              paths_marker,
              '            result["content_conflicts"] = tuple(sorted(content_conflicts))\n\n            local_image_paths = {',
              1,
          )
          remaining_log_marker = "            if not remaining.is_clean:\n                logger.warning("
          if remaining_log_marker not in sync:
              raise SystemExit("remaining log marker not found")
          conflict_log = "\n".join([
              "            if content_conflicts:",
              "                logger.warning(",
              '                    "[Git Sync] 同路径内容冲突已保留本地文件："',
              '                    + "、".join(sorted(content_conflicts)[:5])',
              "                )",
              "",
          ])
          sync = sync.replace(remaining_log_marker, conflict_log + remaining_log_marker, 1)
          main = main[:sync_start] + sync + main[sync_end:]
          main_path.write_text(main, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_row = "| `/立即同步` / `/同步远程` | 管理员 | 立即从远程仓库拉取新增图片到本地 |"
          new_row = "| `/立即同步` / `/同步远程` | 管理员 | 拉取远端变更；同路径本地文件已修改时会保留本地内容并报告冲突 |"
          if old_row not in readme:
              raise SystemExit("README sync command row not found")
          readme_path.write_text(readme.replace(old_row, new_row, 1), encoding="utf-8")

          old_test_path = Path("tests/test_v2116_sync_convergence.py")
          old_test = old_test_path.read_text(encoding="utf-8")
          old_comment = "    # Pull-sync is a remote-authoritative mirror. A remote path must not be\n    # skipped merely because identical bytes exist under a different local path."
          new_comment = "    # Pull-sync still materializes exact remote paths even when identical bytes live\n    # elsewhere locally; same-path local edits are protected by a separate conflict guard."
          if old_comment in old_test:
              old_test_path.write_text(old_test.replace(old_comment, new_comment, 1), encoding="utf-8")

          Path(".github/workflows/apply-sync-local-conflict.yml").unlink()

      - name: Commit scoped hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve local edits during pull sync"
          git push origin HEAD:${GITHUB_REF_NAME}
