name: Temporary gallery remote wiring

on:
  push:
    branches:
      - refactor/gallery-remote-service

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/gallery-remote-service
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply remote wiring patch
        run: python scripts/_tmp_wire_gallery_remote.py
      - name: Verify syntax and new service contract
        run: |
          python -m py_compile main.py gallery_remote.py
          python -m pytest tests/test_gallery_remote_service.py -q
      - name: Commit production patch and remove temporary files
        run: |
          rm -f scripts/_tmp_wire_gallery_remote.py .github/workflows/_tmp_wire_gallery_remote.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: wire gallery remote primitive service"
          git push origin HEAD:refactor/gallery-remote-service
