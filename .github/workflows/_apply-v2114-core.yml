name: Apply v2.11.4 core helpers

on:
  push:
    branches:
      - "fix/perceptual-dedup-and-renumber"
    paths:
      - ".github/workflows/_apply-v2114-core.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "fix/perceptual-dedup-and-renumber"
      - name: Add core helpers
        env:
          BLOCK_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("gallery_safety.py")
          source = path.read_text(encoding="utf-8")
          anchor = "\n\ndef read_bool_flag(obj: object, attribute: str) -> bool:\n"
          if anchor not in source:
              raise SystemExit("read_bool_flag anchor missing")
          if "class ImageFingerprint:" in source:
              raise SystemExit("helpers already present")
          block = base64.b64decode(os.environ["BLOCK_B64"]).decode("utf-8")
          path.write_text(source.replace(anchor, block + anchor, 1), encoding="utf-8")
          PY
      - name: Commit helper implementation
        run: |
          rm .github/workflows/_apply-v2114-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery_safety.py .github/workflows/_apply-v2114-core.yml
          git commit -m "feat: add perceptual dedup and renumber helpers"
          git push origin HEAD:fix/perceptual-dedup-and-renumber
