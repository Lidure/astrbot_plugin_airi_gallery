name: Apply GitHub tree retry fix

on:
  push:
    branches:
      - fix/retry-transient-github-tree-502

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/retry-transient-github-tree-502
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: python .github/scripts/apply_tree_retry_fix.py
      - name: Verify focused regression
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m py_compile main.py gallery_safety.py
          python -m pytest tests/test_hierarchical_renumber.py tests/test_repository_contract.py -q
      - name: Remove temporary patch files and commit
        run: |
          rm -f .github/scripts/apply_tree_retry_fix.py .github/workflows/_apply-tree-retry-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: retry transient GitHub tree creation failures'
          git push origin HEAD:fix/retry-transient-github-tree-502
