name: Apply view-all alias

on:
  push:
    branches:
      - feat/view-all-alias-kan-suoyou
    paths:
      - .github/scripts/apply_view_all_alias.py
      - .github/workflows/_apply-view-all-alias.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/view-all-alias-kan-suoyou
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: python .github/scripts/apply_view_all_alias.py
      - name: Verify focused regression
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_view_all_alias.py -v
          python -m py_compile main.py gallery_safety.py
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/scripts/apply_view_all_alias.py
          rm .github/workflows/_apply-view-all-alias.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py metadata.yaml README.md tests/test_view_all_alias.py .github/scripts/apply_view_all_alias.py .github/workflows/_apply-view-all-alias.yml
          git commit -m 'feat: add 看所有 alias for 看全部'
          git push origin HEAD:feat/view-all-alias-kan-suoyou
