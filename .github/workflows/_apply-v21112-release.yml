name: apply-v21112-release

on:
  push:
    branches:
      - hardening/v21112-remote-consistency
    paths:
      - '.github/scripts/apply_v21112_release.py'
      - '.github/scripts/apply_v21112_release_test_compat.py'
      - '.github/workflows/_apply-v21112-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/v21112-remote-consistency
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply v2.11.12 release patch
        run: |
          python .github/scripts/apply_v21112_release.py
          python .github/scripts/apply_v21112_release_test_compat.py
      - name: Verify release contract
        run: python -m pytest tests/test_v21112_release_contract.py tests/test_v21112_remote_consistency.py -v
      - name: Verify full suite
        run: python -m pytest tests -q
      - name: Verify syntax
        run: python -m py_compile main.py gallery_safety.py gallery_diagnostics.py
      - name: Commit verified release and remove patch artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/apply_v21112_release.py .github/scripts/apply_v21112_release_test_compat.py .github/workflows/_apply-v21112-release.yml
          git add main.py metadata.yaml README.md tests/test_repository_contract.py tests/test_v21111_release_contract.py tests/test_v21112_release_contract.py tests/test_hierarchical_renumber.py tests/test_qq_sticker_reply_upload.py tests/test_v2118_tree_404_diagnostics.py tests/test_view_all_alias.py
          git commit -m 'release: prepare v2.11.12 remote consistency hardening'
          git push origin HEAD:hardening/v21112-remote-consistency
