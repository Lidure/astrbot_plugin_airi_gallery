name: Temporary remote gallery path classifier patch

on:
  push:
    branches:
      - refactor/remote-gallery-path-classifier
    paths:
      - .github/workflows/_tmp_remote_gallery_path_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remote-gallery-path-classifier
      - name: Patch safety helper and Main delegate
        run: |
          python - <<'PY'
          from pathlib import Path

          safety = Path("gallery_safety.py")
          text = safety.read_text(encoding="utf-8")
          marker = "HASH_INDEX_VERSION: int = 3\n\n\n"
          helper = '''HASH_INDEX_VERSION: int = 3\n\n\ndef is_remote_gallery_image_path(\n    git_path: str, supported_suffixes: set[str]\n) -> bool:\n    """Classify Git tree gallery images using platform-independent POSIX semantics."""\n    if "\\\\" in git_path:\n        return False\n    path = PurePosixPath(git_path)\n    parts = path.parts\n    return (\n        len(parts) >= 3\n        and parts[0] == "gallery"\n        and ".." not in parts\n        and path.suffix.lower() in supported_suffixes\n    )\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"unexpected safety marker count: {text.count(marker)}")
          text = text.replace(marker, helper, 1)
          safety.write_text(text, encoding="utf-8")

          main = Path("main.py")
          text = main.read_text(encoding="utf-8")
          import_marker = "        indexed_images_from_remote_tree,\n        matches_verified_remote_content,\n"
          import_replacement = "        indexed_images_from_remote_tree,\n        is_remote_gallery_image_path,\n        matches_verified_remote_content,\n"
          if text.count(import_marker) != 2:
              raise SystemExit(f"unexpected safety import count: {text.count(import_marker)}")
          text = text.replace(import_marker, import_replacement)

          old = '''    @staticmethod\n    def _is_remote_gallery_image(git_path: str) -> bool:\n        parts = Path(git_path).parts\n        return (\n            len(parts) >= 3\n            and parts[0] == "gallery"\n            and ".." not in parts\n            and Path(git_path).suffix.lower() in IMAGE_SUFFIXES\n        )\n'''
          new = '''    @staticmethod\n    def _is_remote_gallery_image(git_path: str) -> bool:\n        return is_remote_gallery_image_path(git_path, IMAGE_SUFFIXES)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"unexpected classifier helper count: {text.count(old)}")
          text = text.replace(old, new)
          main.write_text(text, encoding="utf-8")
          PY
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused tests
        run: python -m pytest tests/test_remote_gallery_path_classification.py -q
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/_tmp_remote_gallery_path_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery_safety.py main.py .github/workflows/_tmp_remote_gallery_path_patch.yml
          git commit -m "refactor: centralize remote gallery path classification"
          git push origin HEAD:refactor/remote-gallery-path-classifier
