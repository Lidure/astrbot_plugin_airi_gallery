name: Apply delete local revalidation

on:
  push:
    branches:
      - hardening/delete-local-revalidation
    paths:
      - .github/apply_delete_local_revalidation.py
      - .github/workflows/apply-delete-local-revalidation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/delete-local-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python .github/apply_delete_local_revalidation.py
      - run: python -m compileall -q main.py
      - run: python -m pytest tests -q
      - name: Commit scoped implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_delete_local_revalidation.py .github/workflows/apply-delete-local-revalidation.yml
          git add main.py
          git commit -m "fix: revalidate local file after remote delete"
          git push origin HEAD:hardening/delete-local-revalidation
