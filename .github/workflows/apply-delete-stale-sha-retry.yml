name: apply-delete-stale-sha-retry

on:
  push:
    branches:
      - hardening/delete-stale-sha-retry
    paths:
      - .github/workflows/apply-delete-stale-sha-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/delete-stale-sha-retry
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/apply_delete_stale_sha_retry.py
      - name: Commit production patch and remove temporary files
        run: |
          rm .github/apply_delete_stale_sha_retry.py
          rm .github/workflows/apply-delete-stale-sha-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py .github
          git commit -m "fix: retry delete once after stale SHA conflict"
          git push origin HEAD:hardening/delete-stale-sha-retry
