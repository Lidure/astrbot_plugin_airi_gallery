name: Temporary browser stream GREEN

on:
  push:
    branches: ["fix/cloud-large-upload-stream"]
    paths:
      - ".github/workflows/_tmp_browser_stream_green.yml"

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cloud-large-upload-stream
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply browser-side streaming revision
        run: |
          python scripts/_tmp_move_base64_to_browser.py
          sed -i 's/attempt == 2/attempt === 2/' pages/zz_cloud/app.js
      - name: Remove temporary artifacts before verification
        run: rm -f scripts/_tmp_move_base64_to_browser.py .github/workflows/_tmp_browser_stream_green.yml
      - name: Verify JavaScript
        run: |
          node --check pages/zz_cloud/app.js
          node --check pages/zz_cloud/blob_stream.mjs
          node --check pages/zz_cloud/worker.js
          node --check pages/zz_cloud/upload_transaction.mjs
          node --test tests/js/cloud_blob_stream.test.mjs tests/js/cloud_large_upload_stream.test.mjs
      - name: Verify full suite
        run: python -m pytest -q
      - name: Check final diff
        run: git diff --check
      - name: Commit verified revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep large upload encoding off Worker CPU"
          git push origin HEAD:fix/cloud-large-upload-stream
