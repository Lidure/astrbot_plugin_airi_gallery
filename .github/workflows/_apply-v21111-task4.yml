name: Apply v2.11.11 task 4

on:
  push:
    branches:
      - hardening/v21111-security

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/v21111-security
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python .github/scripts/apply_v21111_task4.py
      - run: python -m pytest tests/test_github_http_classification.py tests/test_main_diagnostics.py tests/test_hierarchical_renumber.py tests/test_v2118_tree_404_diagnostics.py tests/test_v2116_sync_convergence.py -v
      - run: python -m py_compile main.py gallery_safety.py gallery_diagnostics.py
      - name: Commit verified production change and remove patch artifacts
        run: |
          rm .github/scripts/apply_v21111_task4.py
          rm .github/workflows/_apply-v21111-task4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve git sync during GitHub rate limits'
          git push origin HEAD:hardening/v21111-security
