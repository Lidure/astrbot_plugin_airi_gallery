name: Apply upload batch snapshot

on:
  push:
    branches:
      - perf/upload-batch-snapshot
    paths:
      - .github/apply_upload_batch_snapshot.py
      - .github/workflows/apply-upload-batch-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/upload-batch-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python .github/apply_upload_batch_snapshot.py
      - run: python -m compileall -q main.py
      - run: python -m pytest tests -q
      - name: Commit scoped implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_upload_batch_snapshot.py .github/workflows/apply-upload-batch-snapshot.yml
          git add main.py
          git commit -m "perf: reuse upload batch dedup snapshot"
          git push origin HEAD:perf/upload-batch-snapshot
