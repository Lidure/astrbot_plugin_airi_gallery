name: Final adapter cleanup verified patch

on:
  push:
    branches:
      - refactor/final-cleanup
    paths:
      - scripts/_final_cleanup_patch.py
      - .github/workflows/_final_cleanup_patch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/final-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/_final_cleanup_patch.py
      - run: git rm scripts/_final_cleanup_patch.py .github/workflows/_final_cleanup_patch.yml
      - run: python -m py_compile main.py gallery_diagnostics.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python -m pytest tests -q
      - name: Commit verified final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finish adapter cleanup after service extraction"
          git push origin HEAD:refactor/final-cleanup
