name: Stage 3A push-all verified commit

on:
  push:
    branches:
      - refactor/gallery-sync-service

permissions:
  contents: write

jobs:
  commit-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gallery-sync-service
          fetch-depth: 0

      - name: Apply already-verified push-all migration
        shell: bash
        run: python scripts/_stage3a_push_all_patch.py

      - name: Remove temporary migration tooling
        shell: bash
        run: git rm .github/workflows/_stage3a_push_all_delegate.yml .github/workflows/_stage3a_push_all_commit.yml scripts/_stage3a_push_all_patch.py

      - name: Verify patched working tree
        shell: bash
        run: |
          python -m py_compile gallery_sync.py main.py
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests -q

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move push-all orchestration to GallerySync"
          git push origin HEAD:refactor/gallery-sync-service
