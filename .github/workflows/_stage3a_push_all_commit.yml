name: Stage 3A push-all verified commit

on:
  push:
    branches:
      - refactor/gallery-sync-service

permissions:
  contents: write

jobs:
  commit-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gallery-sync-service
          fetch-depth: 0

      - name: Reapply the already verified patch payload
        shell: bash
        run: python -c "from pathlib import Path; import re,base64; s=Path('.github/workflows/_stage3a_push_all_delegate.yml').read_text(); m=re.search(r\"run: echo '([^']+)' \\| base64 -d \\| python -\",s); assert m; exec(compile(base64.b64decode(m.group(1)),'<stage3a_push_patch>','exec'))"

      - name: Remove temporary workflows
        shell: bash
        run: git rm .github/workflows/_stage3a_push_all_delegate.yml .github/workflows/_stage3a_push_all_commit.yml

      - name: Verify patched working tree
        shell: bash
        run: |
          python -m py_compile gallery_sync.py main.py
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests -q

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- gallery_sync.py main.py .github/workflows
          git commit -m "refactor: move push-all orchestration to GallerySync"
          git push origin HEAD:refactor/gallery-sync-service
