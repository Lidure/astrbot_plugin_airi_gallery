name: QQ compare format

on:
  push:
    branches:
      - feat/qq-upload-conflict-comparison

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/qq-upload-conflict-comparison
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python tools/qq_compare_format.py
      - run: python -m pytest tests/test_qq_upload_conflict_comparison.py -v
      - run: python -m pytest tests -q
      - name: Commit formatting and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git rm .github/workflows/qq-compare-format.yml tools/qq_compare_format.py
          git commit -m "style: normalize QQ comparison call formatting"
          git push origin HEAD:feat/qq-upload-conflict-comparison
