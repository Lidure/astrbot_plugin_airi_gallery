name: Temporary category cover grid patcher

on:
  push:
    branches:
      - ui/category-cover-grid

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/category-cover-grid
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply category cover grid patch
        run: python scripts/_tmp_apply_category_cover_grid.py
      - name: Verify focused tests
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_category_cover_grid.py tests/test_generated_poster_layout.py -q
      - name: Remove temporary patcher files
        run: |
          rm -f scripts/_tmp_apply_category_cover_grid.py
          rm -f .github/workflows/_tmp_apply_category_cover_grid.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery_commands.py gallery_rendering.py main.py tests/test_category_cover_grid.py scripts/_tmp_apply_category_cover_grid.py .github/workflows/_tmp_apply_category_cover_grid.yml
          git commit -m 'feat: show category cover grid'
          git push origin HEAD:ui/category-cover-grid
