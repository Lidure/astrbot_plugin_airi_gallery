name: Stage 3B upload verified patch

on:
  push:
    branches:
      - refactor/gallery-upload-transaction

permissions:
  contents: write

jobs:
  patch-upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/gallery-upload-transaction
          fetch-depth: 0
      - name: Apply upload migration
        run: python scripts/_stage3b_upload_patch.py
      - name: Remove temporary migration tooling
        run: git rm .github/workflows/_stage3b_upload_patch.yml scripts/_stage3b_upload_patch.py
      - name: Verify migrated working tree
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile gallery_sync.py main.py
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests -q
      - name: Commit verified upload migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- gallery_sync.py main.py tests scripts .github/workflows
          git commit -m "refactor: move upload transactions to GallerySync"
          git push origin HEAD:refactor/gallery-upload-transaction
