name: Temporary ref failure classification patch

on:
  push:
    branches:
      - fix/github-ref-failure-classification
    paths:
      - .github/workflows/tmp_ref_failure_fix.yml
      - .github/scripts/apply_ref_failure_classification.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/github-ref-failure-classification
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply bounded patch
        run: python .github/scripts/apply_ref_failure_classification.py
      - name: Verify focused regression suite
        run: >-
          python -m pytest
          tests/test_github_ref_failure_classification.py
          tests/test_github_ref_lost_response.py
          tests/test_v21112_remote_consistency.py
          -q
      - name: Commit production fix and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_ref_failure_fix.yml .github/scripts/apply_ref_failure_classification.py
          git add main.py tests/test_github_ref_lost_response.py
          git diff --cached --check
          git commit -m "fix: classify GitHub ref update failures"
          git push origin HEAD:fix/github-ref-failure-classification
