name: apply cloud transaction fix

on:
  push:
    branches:
      - hardening/cloud-gitee-transaction-consistency
    paths:
      - tools/apply_cloud_transaction_fix.py
      - .github/workflows/apply-cloud-transaction-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/cloud-gitee-transaction-consistency
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/apply_cloud_transaction_fix.py
      - name: Commit patch and remove temporary files
        run: |
          rm tools/apply_cloud_transaction_fix.py
          rm .github/workflows/apply-cloud-transaction-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/zz_cloud/app.js tests/test_cloud_remote_transaction_consistency.py tools/apply_cloud_transaction_fix.py .github/workflows/apply-cloud-transaction-fix.yml
          git commit -m 'fix: harden cloud remote transactions'
          git push origin HEAD:hardening/cloud-gitee-transaction-consistency
