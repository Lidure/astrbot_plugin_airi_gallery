name: Apply verified tree 404 fix

on:
  push:
    branches:
      - fix/verified-404-tree-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verified-404-tree-retry
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: python _tmp_patch_tree_404.py
      - name: Verify focused regression
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_v2118_tree_404_diagnostics.py tests/test_hierarchical_renumber.py -q
          python -m py_compile main.py gallery_safety.py
      - name: Remove temporary files and commit
        run: |
          rm -f _tmp_patch_tree_404.py .github/workflows/_apply-tree-404-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tests/test_v2118_tree_404_diagnostics.py
          git add -u
          git commit -m "fix: verify base tree before retrying GitHub 404"
          git push origin HEAD:fix/verified-404-tree-retry
