name: Apply v2.11.6 sync convergence patch

on:
  push:
    branches:
      - fix/sync-real-path-diff
    paths:
      - .github/workflows/_apply-v2116-sync-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sync-real-path-diff
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_v2116_sync_fix.py
      - name: Verify targeted tests and syntax
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_v2116_sync_convergence.py tests/test_repository_contract.py -q
          python -m py_compile main.py gallery_safety.py
      - name: Remove temporary patch artifacts
        run: |
          rm -f .github/scripts/apply_v2116_sync_fix.py
          rm -f .github/workflows/_apply-v2116-sync-fix.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: converge sync using real gallery paths'
          git push origin HEAD:fix/sync-real-path-diff
