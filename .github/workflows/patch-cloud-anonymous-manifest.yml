name: Patch anonymous manifest read

on:
  push:
    branches:
      - fix/cloud-anonymous-rate-limit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cloud-anonymous-rate-limit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/patch_cloud_anonymous_manifest.py
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python -m pytest tests/test_cloud_anonymous_manifest_read.py -v
      - run: python -m pytest tests -q
      - name: Remove temporary runner files
        run: |
          rm -f scripts/patch_cloud_anonymous_manifest.py
          rm -f .github/workflows/patch-cloud-anonymous-manifest.yml
      - name: Commit verified production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: avoid anonymous GitHub API rate limits"
          git push origin HEAD:fix/cloud-anonymous-rate-limit
