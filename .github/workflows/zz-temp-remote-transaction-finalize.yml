name: Temporary remote transaction finalizer

on:
  push:
    branches:
      - fix/remote-transaction-finalize
    paths:
      - tools/patch_remote_transaction_finalize.py
      - .github/workflows/zz-temp-remote-transaction-finalize.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remote-transaction-finalize
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply production patch
        run: python tools/patch_remote_transaction_finalize.py
      - name: Focused transaction tests
        run: >-
          python -m pytest
          tests/test_remote_transaction_finalization.py
          tests/test_delete_sha_fetch_fail_closed.py
          tests/test_delete_stale_sha_retry.py
          tests/test_gitee_delete_branch.py
          tests/test_gitee_compensation_consistency.py
          -q
      - name: Compile production module
        run: python -m py_compile main.py
      - name: Commit production fix and remove temporary files
        run: |
          rm tools/patch_remote_transaction_finalize.py
          rm .github/workflows/zz-temp-remote-transaction-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize remote transaction consistency"
          git push origin HEAD:fix/remote-transaction-finalize
