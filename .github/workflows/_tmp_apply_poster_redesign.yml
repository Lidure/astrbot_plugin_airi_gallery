name: Apply poster redesign

on:
  push:
    branches:
      - feat/polish-generated-gallery-posters

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/polish-generated-gallery-posters
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python scripts/_tmp_apply_poster_redesign.py
      - run: python -m py_compile main.py gallery_rendering.py
      - run: python -m pytest tests/test_generated_poster_layout.py -q
      - run: python -m pytest tests -q
      - name: Commit verified implementation and remove temporary tools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/_tmp_apply_poster_redesign.py .github/workflows/_tmp_apply_poster_redesign.yml
          git add main.py gallery_rendering.py tests/test_generated_poster_layout.py
          git commit -m 'feat: polish generated gallery posters'
          git push origin HEAD:feat/polish-generated-gallery-posters
