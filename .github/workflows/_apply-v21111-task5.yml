name: apply-v21111-task5

on:
  push:
    branches:
      - hardening/v21111-security
    paths:
      - '.github/scripts/apply_v21111_task5.py'
      - '.github/workflows/_apply-v21111-task5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/v21111-security
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Complete CSP state mapping in Task 5 patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_v21111_task5.py')
          source = path.read_text(encoding='utf-8')
          anchor = '    display_replacements = {\n'
          addition = '''    display_replacements = {\n        "  if (state.totalPages <= 1) { pagerEl.style.display = 'none'; return; }": "  if (state.totalPages <= 1) { pagerEl.classList.add('is-hidden'); return; }",\n        "  pagerEl.style.display = 'flex';": "  pagerEl.classList.remove('is-hidden');",\n'''
          if source.count(anchor) != 1:
              raise SystemExit('display replacement anchor changed')
          path.write_text(source.replace(anchor, addition), encoding='utf-8')
          PY
      - name: Apply Task 5 patch
        run: python .github/scripts/apply_v21111_task5.py
      - name: Verify focused cloud contracts
        run: >-
          python -m pytest
          tests/test_cloud_security_contract.py
          tests/test_repository_contract.py
          tests/test_v2114_integration_contract.py
          -v
      - name: Verify full suite
        run: python -m pytest tests -q
      - name: Verify syntax and security shape
        run: |
          python -m py_compile main.py gallery_safety.py gallery_diagnostics.py
          node --check pages/zz_cloud/app.js
          ! grep -Eqi '<style|style=' pages/zz_cloud/index.html
          ! grep -Eq 'innerHTML[[:space:]]*=[[:space:]]*`[^`]*\$\{' pages/zz_cloud/app.js
          ! grep -Fq '.style.' pages/zz_cloud/app.js
      - name: Commit verified production change and remove patch artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_v21111_task5.py .github/workflows/_apply-v21111-task5.yml
          git add pages/zz_cloud/index.html pages/zz_cloud/style.css pages/zz_cloud/app.js pages/zz_cloud/_headers tests/test_cloud_security_contract.py tests/test_repository_contract.py tests/test_v2114_integration_contract.py
          git commit -m 'fix: harden cloud gallery client security'
          git push origin HEAD:hardening/v21111-security
