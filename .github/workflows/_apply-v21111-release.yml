name: apply-v21111-release

on:
  push:
    branches:
      - hardening/v21111-security
    paths:
      - '.github/scripts/apply_v21111_release.py'
      - '.github/workflows/_apply-v21111-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/v21111-security
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply v2.11.11 release patch
        run: python .github/scripts/apply_v21111_release.py
      - name: Verify release contract
        run: python -m pytest tests/test_v21111_release_contract.py tests/test_repository_contract.py tests/test_view_all_alias.py tests/test_qq_sticker_reply_upload.py tests/test_hierarchical_renumber.py tests/test_v2118_tree_404_diagnostics.py -v
      - name: Verify full suite
        run: python -m pytest tests -q
      - name: Verify syntax and version shape
        run: |
          python -m py_compile main.py gallery_safety.py gallery_diagnostics.py
          node --check pages/zz_cloud/app.js
          grep -Fq 'CURRENT_PLUGIN_VERSION = "v2.11.11"' main.py
          grep -Fq 'version: v2.11.11' metadata.yaml
          grep -Fq 'Version-v2.11.11-pink' README.md
          grep -Fq '### v2.11.11' README.md
      - name: Commit verified v2.11.11 release and remove patch artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/apply_v21111_release.py .github/workflows/_apply-v21111-release.yml
          git add main.py metadata.yaml README.md tests
          git commit -m 'chore: release v2.11.11'
          git push origin HEAD:hardening/v21111-security
