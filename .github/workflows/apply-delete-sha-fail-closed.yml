name: Apply delete SHA fail-closed patch

on:
  push:
    branches:
      - hardening/delete-sha-fetch-fail-closed
    paths:
      - .github/apply_delete_sha_fail_closed.py
      - .github/workflows/apply-delete-sha-fail-closed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/delete-sha-fetch-fail-closed
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/apply_delete_sha_fail_closed.py
      - name: Commit production patch and remove temporary files
        run: |
          rm .github/apply_delete_sha_fail_closed.py
          rm .github/workflows/apply-delete-sha-fail-closed.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py .github
          git commit -m "fix: fail closed when remote delete SHA is unknown"
          git push origin HEAD:hardening/delete-sha-fetch-fail-closed
