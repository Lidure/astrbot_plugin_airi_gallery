name: Stage 4 upload storage verified patch

on:
  push:
    branches:
      - refactor/gallery-upload-storage
    paths:
      - .github/workflows/_stage4_upload_storage_patch.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/gallery-upload-storage
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply Stage 4 migration
        run: python scripts/_stage4_upload_storage_patch.py
      - name: Remove temporary migration files
        run: git rm scripts/_stage4_upload_storage_patch.py .github/workflows/_stage4_upload_storage_patch.yml
      - name: Compile migrated modules
        run: python -m py_compile gallery_store.py gallery_sync.py main.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Run full test suite
        run: python -m pytest tests -q
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move upload storage into GalleryStore"
          git push origin HEAD:refactor/gallery-upload-storage
