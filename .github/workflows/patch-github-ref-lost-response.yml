name: patch-github-ref-lost-response

on:
  push:
    branches:
      - fix/github-ref-lost-response
    paths:
      - .github/scripts/patch_github_ref_lost_response.py
      - .github/workflows/patch-github-ref-lost-response.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/github-ref-lost-response
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python .github/scripts/patch_github_ref_lost_response.py
      - run: python -m pytest tests/test_github_ref_lost_response.py tests/test_v21112_remote_consistency.py -q
      - run: |
          rm .github/scripts/patch_github_ref_lost_response.py
          rm .github/workflows/patch-github-ref-lost-response.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py tests/test_github_ref_lost_response.py .github/scripts/patch_github_ref_lost_response.py .github/workflows/patch-github-ref-lost-response.yml
          git commit -m 'fix: confirm GitHub batch state after lost ref response'
          git push origin HEAD:fix/github-ref-lost-response
