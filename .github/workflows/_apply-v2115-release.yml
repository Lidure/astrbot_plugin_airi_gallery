name: Apply v2.11.5 release patch

on:
  push:
    branches:
      - fix/cloud-delete-immediate-refresh
    paths:
      - .github/scripts/apply_v2115_release.py
      - .github/workflows/_apply-v2115-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cloud-delete-immediate-refresh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply release patch
        run: python .github/scripts/apply_v2115_release.py
      - name: Syntax checks
        run: |
          python -m py_compile main.py gallery_safety.py
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('pages/zz_cloud/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts
          Path('/tmp/cloud.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/cloud.js
      - name: Remove temporary release patch files
        run: rm -f .github/scripts/apply_v2115_release.py .github/workflows/_apply-v2115-release.yml
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py metadata.yaml README.md tests/test_repository_contract.py .github/scripts/apply_v2115_release.py .github/workflows/_apply-v2115-release.yml
          git commit -m "chore: release v2.11.5"
          git push origin HEAD:fix/cloud-delete-immediate-refresh
