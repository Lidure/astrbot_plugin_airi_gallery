name: Temporary reporting patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reporting-helpers
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply patch
        run: python tools/_tmp_patch_reporting.py
      - name: Verify syntax and focused behavior
        run: |
          python -m py_compile main.py gallery_reporting.py
          python -m pytest tests/test_gallery_reporting.py -q
      - name: Remove temporary patch files
        run: rm -f tools/_tmp_patch_reporting.py .github/workflows/_tmp_reporting_patch.yml
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py gallery_reporting.py tools/_tmp_patch_reporting.py .github/workflows/_tmp_reporting_patch.yml
          git commit -m "refactor: delegate sync reporting helpers"
          git push origin HEAD:refactor/reporting-helpers
