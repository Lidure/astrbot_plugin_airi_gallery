name: Temporary v2.11.15 release patcher

on:
  push:
    branches:
      - release/v2.11.15

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/v2.11.15

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply release edits
        run: python .github/scripts/apply_release_21115.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart

      - name: Verify full suite
        run: python -m pytest tests -q

      - name: Remove temporary release tooling
        run: |
          rm -f .github/scripts/apply_release_21115.py
          rm -f .github/workflows/release-v21115.yml

      - name: Commit verified release changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: release v2.11.15'
          git push origin HEAD:release/v2.11.15
