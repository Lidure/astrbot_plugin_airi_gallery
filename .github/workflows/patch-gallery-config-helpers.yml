name: Temporary gallery config helper patch

on:
  push:
    branches:
      - refactor/config-helpers-v21113
    paths:
      - .github/workflows/patch-gallery-config-helpers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/config-helpers-v21113
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Apply bounded refactor
        run: python .github/scripts/patch_gallery_config_helpers.py
      - name: Focused behavior tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_gallery_config.py -q
      - name: Syntax check
        run: python -m py_compile main.py gallery_config.py
      - name: Remove temporary patch artifacts
        run: rm .github/scripts/patch_gallery_config_helpers.py .github/workflows/patch-gallery-config-helpers.yml
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py gallery_config.py .github/scripts/patch_gallery_config_helpers.py .github/workflows/patch-gallery-config-helpers.yml
          git commit -m "refactor: delegate config normalization helpers"
          git push origin HEAD:refactor/config-helpers-v21113
