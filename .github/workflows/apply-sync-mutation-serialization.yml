name: apply-sync-mutation-serialization

on:
  push:
    branches:
      - hardening/sync-mutation-serialization
    paths:
      - .github/workflows/apply-sync-mutation-serialization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/sync-mutation-serialization
          fetch-depth: 0
      - run: python .github/apply_sync_mutation_serialization.py
      - run: |
          git rm .github/apply_sync_mutation_serialization.py
          git rm .github/workflows/apply-sync-mutation-serialization.yml
          git add main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: serialize pull sync with remote mutations"
          git push origin HEAD:hardening/sync-mutation-serialization
