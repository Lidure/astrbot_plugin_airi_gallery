name: apply-sync-mutation-serialization

on:
  push:
    branches:
      - hardening/sync-mutation-serialization
    paths:
      - .github/workflows/apply-sync-mutation-serialization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/sync-mutation-serialization
          fetch-depth: 0
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          old_acquire = '''        if not self._sync_lock.acquire(blocking=False):
              logger.debug("[Git Sync] 已有同步任务进行中，跳过本次。")
              result["busy"] = True
              return result
          try:
'''.replace('          ', '        ', 1)
          new_acquire = '''        if not self._sync_lock.acquire(blocking=False):
              logger.debug("[Git Sync] 已有同步任务进行中，跳过本次。")
              result["busy"] = True
              return result
          self._git_mutation_lock.acquire()
          try:
'''.replace('          ', '        ', 1)

          old_finally = '''        finally:
              self._save_hash_index()
              self._sync_lock.release()
          return result
'''.replace('          ', '        ', 1)
          new_finally = '''        finally:
              try:
                  self._save_hash_index()
              finally:
                  self._git_mutation_lock.release()
                  self._sync_lock.release()
          return result
'''.replace('          ', '        ', 1)

          if source.count(old_acquire) != 1:
              raise SystemExit("sync acquire anchor mismatch")
          if source.count(old_finally) != 1:
              raise SystemExit("sync finally anchor mismatch")

          source = source.replace(old_acquire, new_acquire, 1)
          source = source.replace(old_finally, new_finally, 1)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-sync-mutation-serialization.yml
          git add main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: serialize pull sync with remote mutations"
          git push origin HEAD:hardening/sync-mutation-serialization
