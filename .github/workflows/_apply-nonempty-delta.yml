name: Apply nonempty renumber delta fix

on:
  push:
    branches:
      - fix/nonempty-renumber-delta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nonempty-renumber-delta
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: python _tmp_patch_nonempty_delta.py
      - name: Verify focused regression
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_hierarchical_renumber.py tests/test_v2118_tree_404_diagnostics.py -q
          python -m py_compile main.py gallery_safety.py
      - name: Commit production fix and remove temporary files
        run: |
          rm _tmp_patch_nonempty_delta.py
          rm .github/workflows/_apply-nonempty-delta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py gallery_safety.py tests/test_hierarchical_renumber.py _tmp_patch_nonempty_delta.py .github/workflows/_apply-nonempty-delta.yml
          git commit -m 'fix: avoid empty GitHub category trees during renumber'
          git push origin HEAD:fix/nonempty-renumber-delta
