name: Apply upload candidate dedup fix

on:
  push:
    branches: [fix/dedupe-replied-upload-candidates]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/dedupe-replied-upload-candidates
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: |
          python - <<'PY'
          from pathlib import Path

          safety_path = Path('gallery_safety.py')
          safety = safety_path.read_text(encoding='utf-8')
          marker = '\ndef read_bool_flag(obj: object, attribute: str) -> bool:\n'
          helper = '''\ndef deduplicate_upload_candidates_by_content(\n    candidates: Iterable[tuple[Path, bytes]],\n) -> list[tuple[Path, bytes]]:\n    """Collapse duplicate upload candidates emitted by overlapping reply sources."""\n    seen_hashes: set[bytes] = set()\n    unique: list[tuple[Path, bytes]] = []\n    for path, content in candidates:\n        digest = hashlib.sha256(content).digest()\n        if digest in seen_hashes:\n            continue\n        seen_hashes.add(digest)\n        unique.append((path, content))\n    return unique\n\n'''
          if 'def deduplicate_upload_candidates_by_content(' not in safety:
              if marker not in safety:
                  raise SystemExit('gallery_safety insertion marker not found')
              safety = safety.replace(marker, helper + marker, 1)
              safety_path.write_text(safety, encoding='utf-8')

          main_path = Path('main.py')
          main = main_path.read_text(encoding='utf-8')
          import_anchor = '        compute_image_fingerprint,\n'
          import_line = '        deduplicate_upload_candidates_by_content,\n'
          if main.count(import_line) < 2:
              main = main.replace(import_anchor, import_anchor + import_line)

          start = main.index('    async def _get_reply_images')
          end = main.index('\n    async def _handle_view_number', start)
          block = main[start:end]
          if 'return deduplicate_upload_candidates_by_content(results)' not in block:
              if '        return results\n' not in block:
                  raise SystemExit('reply image return marker not found')
              block = block.replace(
                  '        return results\n',
                  '        return deduplicate_upload_candidates_by_content(results)\n',
                  1,
              )
              main = main[:start] + block + main[end:]
          main_path.write_text(main, encoding='utf-8')
          PY
      - name: Verify regression
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_upload_candidate_dedup.py tests/test_v2114_integration_contract.py -q
          python -m py_compile main.py gallery_safety.py
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/_apply-upload-candidate-dedup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py gallery_safety.py tests/test_upload_candidate_dedup.py .github/workflows/_apply-upload-candidate-dedup.yml
          git commit -m 'fix: dedupe replied upload candidates by content'
          git push origin HEAD:fix/dedupe-replied-upload-candidates
