name: Stage 5 diagnostics verified patch

on:
  push:
    branches:
      - refactor/gallery-diagnostics-service
    paths:
      - scripts/_stage5_diagnostics_patch.py
      - .github/workflows/_stage5_diagnostics_patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/gallery-diagnostics-service
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/_stage5_diagnostics_patch.py
      - run: git rm scripts/_stage5_diagnostics_patch.py .github/workflows/_stage5_diagnostics_patch.yml
      - run: python -m py_compile gallery_diagnostics.py main.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python -m pytest tests -q
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move diagnostics lifecycle into service"
          git push origin HEAD:refactor/gallery-diagnostics-service
