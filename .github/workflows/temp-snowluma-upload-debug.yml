name: Temporary SnowLuma upload debug migration

on:
  push:
    branches:
      - debug/snowluma-upload-payload

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply temporary debug instrumentation
        run: python .github/scripts/apply_snowluma_upload_debug.py
      - name: Compile plugin
        run: python -m py_compile main.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Run focused debug contract
        run: python -m pytest tests/test_snowluma_upload_debug.py -q
      - name: Run full tests
        run: python -m pytest tests -q
      - name: Commit only production debug and regression test
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/scripts/apply_snowluma_upload_debug.py .github/workflows/temp-snowluma-upload-debug.yml
          git add main.py tests/test_snowluma_upload_debug.py
          git commit -m "debug: instrument QQ upload payload validation"
          git push
