name: Apply Gitee branch targeting patch

on:
  push:
    branches:
      - hardening/gitee-delete-branch
    paths:
      - .github/workflows/apply-gitee-branch-targeting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/gitee-delete-branch
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply bounded patch
        run: python .github/apply_gitee_branch_targeting.py
      - name: Commit production patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/apply_gitee_branch_targeting.py .github/workflows/apply-gitee-branch-targeting.yml
          git add main.py
          git commit -m 'fix: target configured branch for gitee writes'
          git push origin HEAD:hardening/gitee-delete-branch
