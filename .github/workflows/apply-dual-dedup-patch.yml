name: Apply dual dedup patch

on:
  push:
    branches:
      - fix/dual-dedup-upload
    paths:
      - .github/patches/apply_dual_dedup_patch.py
      - .github/workflows/apply-dual-dedup-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/dual-dedup-upload
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/patches/apply_dual_dedup_patch.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Verify patch
        run: python -m pytest tests -v
      - name: Remove temporary patch machinery
        run: rm .github/patches/apply_dual_dedup_patch.py .github/workflows/apply-dual-dedup-patch.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require local and remote dedup before upload'
          git push origin fix/dual-dedup-upload
