name: Temporary rendering extraction

on:
  push:
    branches:
      - refactor/maintainability-contracts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rendering-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/maintainability-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - run: python tools/tmp_extract_rendering.py
      - run: python -m pytest tests/test_font_priority.py tests/test_gallery_rendering.py -q
      - run: python -m py_compile main.py gallery_rendering.py
      - run: |
          rm tools/tmp_extract_rendering.py .github/workflows/tmp-extract-rendering.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py gallery_rendering.py tests/test_font_priority.py tests/test_gallery_rendering.py tools/tmp_extract_rendering.py .github/workflows/tmp-extract-rendering.yml
          git commit -m 'refactor: wire gallery rendering module [rendering-extracted]'
          git push origin HEAD:refactor/maintainability-contracts
