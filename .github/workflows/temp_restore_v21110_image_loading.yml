name: Temporary restore v2.11.10 image loading

on:
  push:
    branches:
      - fix/restore-v21110-image-loading

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/temp_restore_v21110_image_loading.py
      - run: node --check pages/gallery/app.js
      - run: node --check pages/zz_cloud/app.js
      - run: python -m pip install pytest pyyaml quart
      - run: python -m pytest tests/test_v21110_image_loading_regression.py -v
      - name: Commit verified production changes and remove temporary runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/temp_restore_v21110_image_loading.py .github/workflows/temp_restore_v21110_image_loading.yml
          git add main.py pages/gallery/app.js pages/zz_cloud/app.js tests/test_v21110_image_loading_regression.py
          git commit -m 'fix: restore stable web image loading semantics'
          git push origin HEAD:fix/restore-v21110-image-loading
