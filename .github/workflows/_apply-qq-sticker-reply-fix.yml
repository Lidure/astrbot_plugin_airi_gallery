name: Apply QQ sticker reply fix

on:
  push:
    branches:
      - fix/qq-downloaded-sticker-reply-upload
    paths:
      - .github/workflows/_apply-qq-sticker-reply-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/qq-downloaded-sticker-reply-upload
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_qq_sticker_reply_fix.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Focused regression
        run: |
          python -m pytest tests/test_qq_sticker_reply_upload.py tests/test_upload_candidate_dedup.py -v
          python -m py_compile main.py gallery_safety.py
      - name: Full test suite
        run: python -m pytest tests -q
      - name: Commit verified production change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/scripts/apply_qq_sticker_reply_fix.py .github/workflows/_apply-qq-sticker-reply-fix.yml
          git add -A
          git commit -m "fix: recognize replied QQ downloaded stickers"
          git push origin HEAD:fix/qq-downloaded-sticker-reply-upload
