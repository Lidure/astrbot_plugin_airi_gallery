name: QQ compare GREEN

on:
  push:
    branches:
      - feat/qq-upload-conflict-comparison

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/qq-upload-conflict-comparison
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply GREEN implementation
        run: python tools/qq_compare_green.py
      - name: Verify QQ comparison regression
        run: python -m pytest tests/test_qq_upload_conflict_comparison.py -v
      - name: Verify full suite
        run: python -m pytest tests -q
      - name: Commit verified implementation and remove temporary migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py gallery_rendering.py tests/test_qq_upload_conflict_comparison.py
          git rm .github/workflows/qq-compare-green.yml tools/qq_compare_green.py
          git commit -m "feat: compare QQ duplicate uploads side by side"
          git push origin HEAD:feat/qq-upload-conflict-comparison
