name: Temporary command helper extraction

on:
  push:
    branches:
      - refactor/command-helpers-v21113
    paths:
      - .github/workflows/patch-command-helpers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/command-helpers-v21113
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Apply extraction
        run: python .github/scripts/patch_command_helpers.py
      - name: Focused verification
        run: |
          python -m py_compile main.py gallery_commands.py
          python -m pytest tests/test_gallery_commands.py tests/test_main_diagnostics.py -q
      - name: Commit extraction and self-clean temporary files
        run: |
          rm -f .github/scripts/patch_command_helpers.py .github/workflows/patch-command-helpers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: wire gallery command helpers"
          git push origin HEAD:refactor/command-helpers-v21113
