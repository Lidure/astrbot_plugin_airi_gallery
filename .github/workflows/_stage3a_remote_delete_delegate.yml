name: Stage 3A remote delete delegate

on:
  push:
    branches:
      - refactor/gallery-sync-service
    paths:
      - .github/workflows/_stage3a_remote_delete_delegate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/gallery-sync-service
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml quart
      - name: Replace Main delete implementation with compatibility delegate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('main.py')
          source = main_path.read_text(encoding='utf-8')
          signature = '    def _git_delete_file(self, path: str, message: str) -> bool:\n'
          start = source.index(signature)
          next_method = source.index('\n    def ', start + len(signature))
          replacement = '''    def _git_delete_file(self, path: str, message: str) -> bool:\n        """Compatibility delegate; GallerySync owns the delete transaction."""\n        return self.sync.delete_file(path, message)\n'''
          source = source[:start] + replacement + source[next_method:]
          main_path.write_text(source, encoding='utf-8')

          contract_path = Path('tests/test_v21112_remote_consistency.py')
          contract = contract_path.read_text(encoding='utf-8')
          old = '''    # Until each transaction body is mechanically moved, Main compatibility\n    # delegates must still serialize through the service-owned lock.\n    source = Path("main.py").read_text(encoding="utf-8")\n    for name in (\n        "_git_delete_file",\n        "_git_commit_github_batch",\n        "_github_commit_renumber",\n    ):\n        block = _method_block(source, name)\n        assert "with self._git_mutation_lock:" in block, name\n'''
          new = '''    # Transaction bodies not yet migrated in Stage 3A still serialize through\n    # the service-owned lock. Remote delete is already a GallerySync delegate.\n    source = Path("main.py").read_text(encoding="utf-8")\n    for name in (\n        "_git_commit_github_batch",\n        "_github_commit_renumber",\n    ):\n        block = _method_block(source, name)\n        assert "with self._git_mutation_lock:" in block, name\n'''
          if old not in contract:
              raise SystemExit('remote consistency ownership block did not match expected source')
          contract_path.write_text(contract.replace(old, new, 1), encoding='utf-8')
          PY

          python -m pytest tests/test_gallery_sync_service.py::test_main_remote_delete_is_only_a_gallery_sync_compatibility_delegate -q
          python -m pytest tests -q
      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_stage3a_remote_delete_delegate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: delegate remote delete to GallerySync'
          git push origin HEAD:refactor/gallery-sync-service
