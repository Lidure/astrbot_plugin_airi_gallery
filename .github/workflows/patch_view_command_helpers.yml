name: Patch view command helpers

on:
  push:
    branches:
      - refactor/view-command-parsing-v21113
    paths:
      - .github/workflows/patch_view_command_helpers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/view-command-parsing-v21113
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python .github/scripts/patch_view_command_helpers.py
      - name: Verify syntax and focused behavior
        run: |
          python -m py_compile main.py gallery_commands.py
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_gallery_commands.py tests/test_main_diagnostics.py -q
      - name: Remove temporary patch artifacts and commit
        run: |
          git rm .github/scripts/patch_view_command_helpers.py .github/workflows/patch_view_command_helpers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py gallery_commands.py tests/test_gallery_commands.py tests/test_main_diagnostics.py
          git commit -m "refactor: isolate view command parsing helpers"
          git push origin HEAD:refactor/view-command-parsing-v21113
# rerun after locking MODE_PREFIX import
