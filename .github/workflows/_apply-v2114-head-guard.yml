name: Apply v2.11.4 renumber head guard
on:
  push:
    branches: [fix/perceptual-dedup-and-renumber]
    paths: [.github/workflows/_apply-v2114-head-guard.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/perceptual-dedup-and-renumber
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_v2114_head_guard.py
      - run: python -m py_compile main.py gallery_safety.py
      - run: rm -f .github/scripts/apply_v2114_head_guard.py .github/workflows/_apply-v2114-head-guard.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Lidure@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind gallery renumbering to one GitHub head"
          git push origin HEAD:fix/perceptual-dedup-and-renumber
