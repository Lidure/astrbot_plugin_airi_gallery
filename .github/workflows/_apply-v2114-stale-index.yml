name: Apply v2.11.4 stale index guard

on:
  push:
    branches:
      - "fix/perceptual-dedup-and-renumber"
    paths:
      - ".github/workflows/_apply-v2114-stale-index.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "fix/perceptual-dedup-and-renumber"
      - name: Filter stale local hash entries from active dedup view
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("main.py")
          source = path.read_text(encoding="utf-8")
          old = '''    def _indexed_local_images(self) -> tuple[IndexedImage, ...]:
                  self._ensure_perceptual_index()
                  with self._hash_index_lock:
                      snapshot = dict(self._hash_index)
                  return indexed_images_from_hash_index(snapshot)
          '''.replace('                  ', '        ')
          new = '''    def _indexed_local_images(self) -> tuple[IndexedImage, ...]:
                  self._ensure_perceptual_index()
                  with self._hash_index_lock:
                      snapshot = dict(self._hash_index)
                  active: list[IndexedImage] = []
                  for record in indexed_images_from_hash_index(snapshot):
                      local_path = resolve_gallery_local_path(self.gallery_root.parent, record.path)
                      if local_path is not None and local_path.exists() and _is_image_file(local_path):
                          active.append(record)
                  return tuple(active)
          '''.replace('                  ', '        ')
          if source.count(old) != 1:
              raise SystemExit(f"indexed_local_images anchor count={source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Syntax check
        run: python -m py_compile main.py
      - name: Commit guard
        run: |
          rm .github/workflows/_apply-v2114-stale-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/_apply-v2114-stale-index.yml
          git commit -m "fix: ignore stale local hash entries during upload dedup"
          git push origin HEAD:fix/perceptual-dedup-and-renumber
