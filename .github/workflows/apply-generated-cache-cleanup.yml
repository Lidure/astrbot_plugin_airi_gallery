name: Apply generated cache cleanup

on:
  push:
    branches:
      - hardening/generated-cache-cleanup
    paths:
      - .github/workflows/apply-generated-cache-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/generated-cache-cleanup
          fetch-depth: 0

      - name: Apply exact generated cache edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "\ntry:\n    from .gallery_safety import (\n"
          import_replacement = "\ntry:\n    from .generated_cache import cleanup_generated_files\nexcept ImportError:\n    from generated_cache import cleanup_generated_files\n\ntry:\n    from .gallery_safety import (\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f"unexpected gallery_safety import anchor count: {text.count(import_anchor)}")
          text = text.replace(import_anchor, import_replacement, 1)

          method_anchor = "    def _iter_recent_images(self, count: int = 10) -> list[Path]:\n"
          method_block = "\n".join([
              "    def _prepare_generated_output_dir(self) -> Path:",
              "        output_dir = self.plugin_data_dir / \"generated\"",
              "        removed = cleanup_generated_files(output_dir)",
              "        if removed:",
              "            logger.info(f\"[Gallery] 已清理 {removed} 个过期/超额生成图片缓存。\")",
              "        return output_dir",
              "",
              method_anchor.rstrip("\n"),
          ]) + "\n"
          if text.count(method_anchor) != 1:
              raise SystemExit(f"unexpected recent-images anchor count: {text.count(method_anchor)}")
          text = text.replace(method_anchor, method_block, 1)

          old_output = "        output_dir = self.plugin_data_dir / \"generated\"\n        output_dir.mkdir(parents=True, exist_ok=True)\n"
          if text.count(old_output) != 4:
              raise SystemExit(f"unexpected generated output block count: {text.count(old_output)}")
          text = text.replace(old_output, "        output_dir = self._prepare_generated_output_dir()\n")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit scoped integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-generated-cache-cleanup.yml
          git add main.py
          git commit -m "fix: bound generated image cache growth"
          git push origin HEAD:hardening/generated-cache-cleanup
