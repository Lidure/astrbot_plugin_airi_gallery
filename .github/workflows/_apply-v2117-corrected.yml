name: Apply corrected v2.11.7 hierarchical renumber

on:
  push:
    branches:
      - fix/hierarchical-renumber-commit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/hierarchical-renumber-commit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply corrected implementation
        run: python tools/_apply_v2117_hierarchical.py
      - name: Verify focused regression and syntax
        run: |
          python -m pip install -r requirements.txt pytest pyyaml quart
          python -m pytest tests/test_hierarchical_renumber.py tests/test_repository_contract.py -v
          python -m py_compile main.py gallery_safety.py
      - name: Remove temporary patch artifacts
        run: |
          rm -f .github/workflows/_apply-v2117-hierarchical-renumber.yml
          rm -f .github/workflows/_apply-v2117-corrected.yml
          rm -f tools/_apply_v2117_hierarchical.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: build hierarchical trees for gallery renumber'
          git push origin HEAD:fix/hierarchical-renumber-commit
